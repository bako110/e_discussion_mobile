buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        // 26 minimum : requis par react-native-vision-camera v4 (scanner QR).
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Windows : le chemin de build CMake de react-native-reanimated depasse la limite
// des 260 caracteres (ninja : "mkdir ... No such file or directory" sur
// .../CMakeFiles/worklets.dir/C_/Users/PC1/projetSah/...). On redirige le dossier
// de staging CMake (.cxx) de reanimated vers un chemin tres court : C:\rnbuild.
if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    subprojects { subproject ->
        if (subproject.name == "react-native-reanimated") {
            subproject.afterEvaluate {
                subproject.android {
                    externalNativeBuild {
                        cmake {
                            buildStagingDirectory = new File("C:/rnbuild/reanimated/.cxx")
                        }
                    }
                }
            }
        }
    }
}
